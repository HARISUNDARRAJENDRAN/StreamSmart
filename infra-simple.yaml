AWSTemplateFormatVersion: '2010-09-09'
Description: StreamSmart Light Usage Infrastructure

Parameters:
  VpcIdParam:
    Type: String
    Default: vpc-0cc433a6e70c9d8a3
  Subnet1Param:
    Type: String
    Default: subnet-090f0ddbfc59fadbd
  Subnet2Param:
    Type: String
    Default: subnet-09e2d9ccd6fd72143

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: streamsmart-cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

  RAGS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'streamsmart-rag-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled

  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: streamsmart-rag
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 50
        VolumeType: gp3
      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'es:*'
            Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/streamsmart-rag/*'
      VPCOptions:
        SubnetIds:
          - !Ref Subnet1Param
        SecurityGroupIds:
          - !Ref OpenSearchSecurityGroup

  OpenSearchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OpenSearch security group
      VpcId: !Ref VpcIdParam
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks security group
      VpcId: !Ref VpcIdParam
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/streamsmart-backend
      RetentionInDays: 7

Outputs:
  OpenSearchEndpoint:
    Value: !GetAtt OpenSearchDomain.DomainEndpoint
  S3BucketName:
    Value: !Ref RAGS3Bucket
  ECSClusterName:
    Value: !Ref ECSCluster
  BackendECRRepository:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/streamsmart-backend'
